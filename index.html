<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>絵画を聴く</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    .container, .modal-overlay { position: relative; z-index: 9999 !important; }
    .a-canvas { pointer-events: none !important; }
    .mindar-ui-overlay { z-index: 9000 !important; }
  </style>
</head>
<body>

  <div id="ar-container" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;">
    <a-scene embedded mindar-image="imageTargetSrc: mind/targets.mind; autoStart: false;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0" id="target-0"></a-entity>
      <a-entity mindar-image-target="targetIndex: 1" id="target-1"></a-entity>
      <a-entity mindar-image-target="targetIndex: 2" id="target-2"></a-entity>
      <a-entity mindar-image-target="targetIndex: 3" id="target-3"></a-entity>
      <a-entity mindar-image-target="targetIndex: 4" id="target-4"></a-entity>
    </a-scene>
  </div>

  <canvas id="camera-canvas" width="64" height="64" style="display: none;"></canvas>

  <div id="ar-exit-btn" style="display: none; position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 100000; background: rgba(0,0,0,0.6); color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 0.8rem; letter-spacing: 0.1em; cursor: pointer; text-align: center; border: 1px solid rgba(255,255,255,0.3);">
    × 閉じる
  </div>

  <!-- ============================================== -->
  <!-- 1. 最初の画面（展示モード ＋ ランダム再生） -->
  <!-- ============================================== -->
  <div class="container" id="app-exhibit" style="display: block;">
    <header style="display: flex; justify-content: space-between; align-items: flex-start;">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <h1 style="margin: 0; font-size: 1.15rem; font-weight: 400; letter-spacing: 0.25em; color: var(--text-main);">
          絵画を聴く
        </h1>
        <span class="project-badge-label badge-date">展示モード</span>
      </div>
      <button id="btn-to-workshop" class="action-btn" style="border: 1px solid var(--text-main); padding: 6px 12px; border-radius: 4px; background: var(--text-main); color: var(--bg-color); font-weight: bold; letter-spacing: 0.1em;">ワークショップへ</button>
    </header>

    <div class="section" style="text-align: center; margin-top: 40px; padding-bottom: 30px;">
      <h2 style="font-size: 0.9rem; letter-spacing: 0.15em; margin-bottom: 20px; color: var(--text-main);">気配に触れる</h2>
      <div style="display: flex; flex-direction: column; gap: 15px;">
        <button id="btn-choice-exhibit-ar" class="record-btn-boxed">ドローイングや立体物にかざして体験</button>
      </div>

      <!-- ★ランダム再生ボタンを最初の画面のARボタンの下に移動 -->
      <div style="margin-top: 50px; padding-top: 30px; border-top: 1px dashed var(--line-color);">
        <h2 style="font-size: 0.9rem; letter-spacing: 0.15em; margin-bottom: 20px; color: var(--text-main);">作品を聴く</h2>
        <button id="btn-listen-everyone" class="record-btn-boxed" style="background-color: var(--text-main); color: var(--bg-color);">みんなの作品をランダムに再生</button>
        <div id="current-playing-info" style="margin-top: 15px; font-size: 0.75rem; color: var(--text-main); min-height: 1.5em; font-weight: bold;"></div>
      </div>
    </div>
  </div>

  <!-- ============================================== -->
  <!-- 2. ワークショップ用 ログイン＆選択モーダル -->
  <!-- ============================================== -->
  <div id="user-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content" id="modal-step-login">
      <h2 style="margin-bottom: 20px;">ワークショップ ログイン</h2>
      <input type="text" id="input-username" placeholder="名前を入力">
      <button id="btn-ws-login" class="record-btn-boxed" style="margin-top: 20px;">次へ</button>
      <button id="btn-ws-login-back" class="action-btn-back">展示に戻る</button>
    </div>

    <div class="modal-content" id="modal-step-select" style="display: none;">
      <h2 style="margin-bottom: 30px;">プロジェクトを選択</h2>
      <div style="display: flex; flex-direction: column; gap: 20px;">
        <button id="btn-choice-mikiki-ws" class="record-btn-boxed">ミキキの交差点</button>
        <button id="btn-choice-guide-ws" class="record-btn-boxed">ヒーリング音声ガイド</button>
      </div>
      <button id="btn-ws-select-back" class="action-btn-back">戻る</button>
    </div>
  </div>

  <!-- ============================================== -->
  <!-- 3. 作品一覧モーダル -->
  <!-- ============================================== -->
  <div id="works-modal" class="modal-overlay" style="display: none; z-index: 30000;">
    <div class="modal-content" style="max-width: 500px; width: 90%; max-height: 80vh; display: flex; flex-direction: column; padding: 20px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0; font-size: 1rem;">完成作品一覧</h2>
        <button id="btn-close-works" class="action-btn-back" style="margin: 0; width: auto; padding: 6px 12px;">閉じる</button>
      </div>
      <div id="works-list-container" style="overflow-y: auto; flex-grow: 1;"></div>
    </div>
  </div>

  <!-- ============================================== -->
  <!-- 4. ワークショップ 制作画面 -->
  <!-- ============================================== -->
  <div class="container" id="main-app" style="display: none;">
    <header style="display: flex; justify-content: space-between; align-items: flex-start;">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <h1 class="logo-home-trigger" style="margin: 0; font-size: 1.15rem; font-weight: 400; letter-spacing: 0.25em; color: var(--text-main); cursor: pointer;">
            絵画を聴く
          </h1>
          <span class="project-badge-label badge-date" id="ws-badge">ワークショップ</span>
        </div>
        <div style="font-size: 0.65rem; font-weight: 300; letter-spacing: 0.1em; color: var(--text-muted);">User: <span id="current-user-display" style="color: var(--text-main);"></span></div>
      </div>
      <!-- ★作品一覧ボタンを右上に復活 -->
      <button id="btn-show-works" class="action-btn" style="border: 1px solid var(--text-main); padding: 4px 8px; border-radius: 4px; background: transparent; color: var(--text-main); font-size: 0.65rem;">作品一覧</button>
    </header>

    <button class="btn-global-back" style="margin-bottom: 20px; font-size: 0.65rem; cursor: pointer; color: var(--text-muted); border: none; background: transparent; letter-spacing: 0.1em; text-align: left;">← 戻る</button>

    <div class="section" style="position: sticky; top: 0; background: var(--bg-color); padding-top: 15px; padding-bottom: 10px; margin-left: -10px; margin-right: -10px; padding-left: 10px; padding-right: 10px; border-bottom: 1px solid var(--line-color); box-shadow: 0 4px 6px -6px rgba(0,0,0,0.1); z-index: 1000;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <div class="section-title" style="margin: 0;">Timeline</div>
        <button id="btn-master-play-stop" class="record-btn-boxed" style="width: auto; padding: 6px 16px; font-size: 0.75rem; margin: 0;">全体を再生</button>
      </div>
      <div class="timeline-wrapper" id="timeline-wrapper" style="max-height: 150px; overflow-y: auto; background-color: #fafafa; border-radius: 4px; padding: 5px;">
        <div class="timeline-container" id="timeline-container">
          <div class="playhead" id="playhead"></div>
          <div id="timeline-tracks"></div>
        </div>
      </div>
    </div>

    <div class="section" id="input-record-section" style="margin-top: 20px;">
      <div class="section-title">Input (自分の声を録音する)</div>
      <button id="btn-record" class="record-btn-boxed">マイクで録音</button>
    </div>

    <div class="section" style="margin-top: 20px;">
      <div class="section-title">Mixer (音源リスト)</div>
      <div id="empty-msg">環境を読み込み中...</div>
      <div class="track-list" id="track-list"></div>
    </div>

    <div class="section" style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--line-color);">
      <div class="section-title">Export (曲を完成させる)</div>
      <p style="font-size: 0.65rem; color: var(--text-muted); margin-bottom: 10px;">ONになっている音を合成してクラウドに投稿します。（長さは自動で調整されます）</p>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="input-export-name" placeholder="作品のタイトル" style="flex-grow: 1; padding: 8px; border: 1px solid var(--line-color); border-radius: 4px; font-size: 0.8rem;">
        <button id="btn-export-master" class="record-btn-boxed" style="margin: 0; width: auto; padding: 0 20px; font-size: 0.8rem;">投稿する</button>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
