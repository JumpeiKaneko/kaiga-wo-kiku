<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>フィールドレコーディング ワークショップ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============================================== -->
  <!-- 1. ログインモーダル（名前入力のみ） -->
  <!-- ============================================== -->
  <div id="user-modal" class="modal-overlay">
    <div class="modal-content" id="modal-step-login">
      <h2>フィールドレコーディング<br>ワークショップ</h2>
      <input type="text" id="input-username" placeholder="名前を入力">
      <button id="btn-login" class="record-btn-boxed" style="margin-top: 20px;">はじめる</button>
    </div>
  </div>

  <!-- ============================================== -->
  <!-- 2. メイン画面（録音・ミキサー・書き出し） -->
  <!-- ============================================== -->
  <div class="container" id="main-app" style="display: none;">
    <header style="display: flex; justify-content: space-between; align-items: flex-start;">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <h1 style="margin: 0; font-size: 1.05rem; font-weight: 400; letter-spacing: 0.2em; color: var(--text-main); line-height: 1.5;">フィールド<br>レコーディング</h1>
        <div style="font-size: 0.65rem; font-weight: 300; letter-spacing: 0.1em; color: var(--text-muted);">User: <span id="current-user-display" style="color: var(--text-main);"></span></div>
      </div>
    </header>

    <div class="section" id="input-record-section" style="margin-top: 10px; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--line-color);">
      <div class="section-title">Record</div>
      <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        <button id="btn-record" class="record-btn-boxed" style="margin: 0; width: auto; padding: 10px 24px; font-size: 0.85rem;">録音を開始</button>
        <span id="record-status-msg" style="font-size: 0.65rem; color: var(--text-muted);">環境音を録音して追加できます</span>
      </div>
    </div>

    <div class="section" style="position: sticky; top: 0; background: var(--bg-color); padding-top: 15px; padding-bottom: 10px; margin-left: -10px; margin-right: -10px; padding-left: 10px; padding-right: 10px; border-bottom: 1px solid var(--line-color); box-shadow: 0 4px 6px -6px rgba(0,0,0,0.1); z-index: 1000;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <div class="section-title" style="margin: 0;">Timeline</div>
        <button id="btn-master-play-stop" class="record-btn-boxed" style="width: auto; padding: 6px 16px; font-size: 0.75rem; margin: 0;">全体を再生</button>
      </div>
      <div class="timeline-wrapper" id="timeline-wrapper" style="max-height: 150px; overflow-y: auto; background-color: #fafafa; border-radius: 4px; padding: 5px;">
        <div class="timeline-container" id="timeline-container">
          <div class="playhead" id="playhead"></div>
          <div id="timeline-tracks"></div>
        </div>
      </div>
    </div>

    <div class="section" style="margin-top: 20px;">
      <div class="section-title">Mixer</div>
      <div id="empty-msg">まだ録音がありません。</div>
      <div class="track-list" id="track-list"></div>
    </div>

    <div class="section" style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--line-color);">
      <div class="section-title">Export</div>
      <p style="font-size: 0.65rem; color: var(--text-muted); margin-bottom: 10px;">ONになっている音を合成してファイルとしてダウンロードします。（長さは自動で調整されます）</p>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="input-export-name" placeholder="作品のタイトル" style="flex-grow: 1; padding: 8px; border: 1px solid var(--line-color); border-radius: 4px; font-size: 0.8rem;">
        <button id="btn-export-master" class="record-btn-boxed" style="margin: 0; width: auto; padding: 0 20px; font-size: 0.8rem;">ダウンロード</button>
      </div>

      <div id="output-player-container" style="display: none; margin-top: 20px; padding-top: 15px; border-top: 1px dashed var(--line-color);">
        <div style="font-size: 0.65rem; color: var(--text-muted); margin-bottom: 10px;">書き出した作品</div>
        <div class="track-item" style="display: flex; flex-direction: column; gap: 15px; border: none; padding: 0;">
          <div class="track-name" id="output-file-name" style="letter-spacing: 0.1em; color: var(--text-main); font-size: 0.8rem; font-weight: bold; width: 100%; word-break: break-all;">Master Track</div>
          <div class="track-controls" style="display: flex; gap: 10px; width: 100%; justify-content: flex-end;">
            <button id="btn-output-loop" class="action-btn active" style="font-size: 0.7rem; padding: 8px 12px;">Loop: ON</button>
            <button id="btn-output-play" class="action-btn" style="font-size: 0.7rem; padding: 8px 12px;">再生</button>
            <button id="btn-output-stop" class="action-btn" style="font-size: 0.7rem; padding: 8px 12px;">停止</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
