<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>絵画を聴く</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
</head>
<body>

  <!-- カラー検知（AR）用の隠しカメラ＆キャンバス -->
  <video id="camera-video" autoplay playsinline muted style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; opacity: 0.1; filter: grayscale(100%);"></video>
  <canvas id="camera-canvas" style="display: none;"></canvas>

  <!-- ============================================== -->
  <!-- 1. サイトを開いて最初の画面（気配に触れる） -->
  <!-- ============================================== -->
  <div class="container" id="app-exhibit" style="display: block;">
    <header style="display: flex; justify-content: space-between; align-items: flex-start;">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <h1 style="margin: 0; font-size: 1.15rem; font-weight: 400; letter-spacing: 0.25em; color: var(--text-main);">
          気配に触れる
        </h1>
        <span class="project-badge-label badge-date">展示</span>
      </div>
      <button id="btn-to-workshop" class="action-btn" style="border: 1px solid var(--text-main); padding: 6px 12px; border-radius: 4px;">ワークショップへ</button>
    </header>

    <div class="section" id="exhibit-select-section" style="text-align: center; margin-top: 40px;">
      <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 30px;">体験方法を選択してください</p>
      <div style="display: flex; flex-direction: column; gap: 20px;">
        <button id="btn-choice-beacon" class="record-btn-boxed">空間を歩いて体験 (ビーコン)</button>
        <button id="btn-choice-camera" class="record-btn-boxed">色を探して体験 (ARカメラ)</button>
      </div>
    </div>

    <div class="section" id="exhibit-play-section" style="display: none; text-align: center; margin-top: 40px;">
      <p id="exhibit-mode-text" style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 30px;"></p>
      <button id="btn-exhibit-scan" class="record-btn-boxed">再生</button>
      <button id="btn-exhibit-back" class="action-btn-back" style="margin-top: 30px;">選び直す</button>
    </div>
  </div>

  <!-- ============================================== -->
  <!-- 2. ワークショップ用 ログイン＆選択モーダル -->
  <!-- ============================================== -->
  <div id="user-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content" id="modal-step-login">
      <h2 style="margin-bottom: 20px;">ワークショップ ログイン</h2>
      <input type="text" id="input-username" placeholder="名前を入力">
      <button id="btn-ws-login" class="record-btn-boxed" style="margin-top: 20px;">次へ</button>
      <button id="btn-ws-login-back" class="action-btn-back">展示に戻る</button>
    </div>

    <div class="modal-content" id="modal-step-select" style="display: none;">
      <h2 style="margin-bottom: 30px;">プロジェクトを選択</h2>
      <div style="display: flex; flex-direction: column; gap: 20px;">
        <button id="btn-choice-mikiki-ws1" class="record-btn-boxed">ミキキの交差点</button>
        <button id="btn-choice-guide-ws2" class="record-btn-boxed">非言語音声ガイド</button>
      </div>
      <button id="btn-ws-select-back" class="action-btn-back">戻る</button>
    </div>
  </div>

  <!-- 作品一覧モーダル（既存流用） -->
  <div id="works-modal" class="modal-overlay" style="display: none; z-index: 3000;">
    <div class="modal-content" style="max-width: 500px; width: 90%; max-height: 80vh; display: flex; flex-direction: column;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h2 style="margin-bottom: 0; font-size: 0.9rem; letter-spacing: 0.15em;">作品一覧</h2>
        <button id="btn-close-works" class="action-btn">閉じる</button>
      </div>
      <div id="works-list-container" style="overflow-y: auto; text-align: left; flex-grow: 1; padding-right: 10px;"></div>
    </div>
  </div>

  <!-- ============================================== -->
  <!-- 3. ワークショップ 制作画面 (元の美しいUIのまま) -->
  <!-- ============================================== -->
  <div class="container" id="main-app" style="display: none;">
    <header style="display: flex; justify-content: space-between; align-items: flex-start;">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <h1 class="logo-home-trigger" style="margin: 0; font-size: 1.15rem; font-weight: 400; letter-spacing: 0.25em; color: var(--text-main); cursor: pointer;">
            絵画を聴く
          </h1>
          <span class="project-badge-label badge-date" id="ws-badge">ワークショップ</span>
        </div>
        <div style="font-size: 0.65rem; font-weight: 300; letter-spacing: 0.1em; color: var(--text-muted);">User: <span id="current-user-display" style="color: var(--text-main);"></span></div>
      </div>
      <button id="btn-show-works-record" class="action-btn" style="margin-top: 2px;">作品一覧</button>
    </header>

    <button class="btn-global-back" style="margin-bottom: 20px; font-size: 0.65rem; cursor: pointer; color: var(--text-muted); border: none; background: transparent; letter-spacing: 0.1em; text-align: left;">← 戻る</button>

    <div class="section" id="input-record-section">
      <div class="section-title">Input</div>
      <button id="btn-record" class="record-btn-boxed">録音を開始</button>
    </div>

    <!-- ★スクロール追従（固定表示）される再生コントロール -->
    <div class="section" id="sticky-play-section">
      <button id="btn-master-play-stop" class="record-btn-boxed">再生</button>
    </div>

    <!-- ★スクロール追従（固定表示）されるタイムライン -->
    <div class="section" id="sticky-timeline-section">
      <div class="section-title">Timeline</div>
      <div class="timeline-wrapper" id="timeline-wrapper">
        <div class="timeline-container" id="timeline-container">
          <div class="playhead" id="playhead"></div>
          <div id="timeline-tracks"></div>
        </div>
      </div>
    </div>

    <!-- ミキサー (全トラックが一番上に最新順で並ぶ) -->
    <div class="section">
      <div class="section-title">Mixer</div>
      <div id="empty-msg">環境を読み込み中...</div>
      <div class="track-list" id="track-list"></div>
    </div>

    <!-- リバーブ -->
    <div class="section" style="padding-top: 20px; border-top: 1px solid var(--line-color);">
      <div class="section-title">REVERB (空間の響き)</div>
      <div class="slider-wrapper">
        <input type="range" id="master-reverb" min="0" max="1" step="0.01" value="0">
      </div>
    </div>

    <!-- エクスポート -->
    <div class="section" id="export-section">
      <div class="section-title">Share</div>
      <input type="text" id="input-export-name" class="export-name-input" placeholder="音のタイトルを入力">
      <button id="btn-export-master" class="record-btn-export">作品を完成させる</button>
      
      <div id="output-player-container" style="display: none; margin-top: 30px;">
        <div class="track-item" style="flex-direction: row; align-items: center; justify-content: space-between;">
          <div class="track-name" id="output-file-name" style="letter-spacing: 0.1em; color: var(--text-main);">Master Track</div>
          <div class="track-controls" style="gap: 20px;">
            <button id="btn-output-loop" class="action-btn active" style="letter-spacing: 0.1em;">Loop: ON</button>
            <button id="btn-output-play" class="action-btn" style="letter-spacing: 0.1em;">再生</button>
            <button id="btn-output-stop" class="action-btn" style="letter-spacing: 0.1em;">停止</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
